spring.application.name=chatApp

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/chatappdb
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# .env file import
spring.config.import=optional:file:.env[.properties]

# Firebase Admin SDK — service account JSON in src/main/resources/
firebase.service-account-path=firebase-service-account.json

# firebase notification access
firebase.api-key=${FIREBASE_API_KEY}
firebase.auth-domain=${FIREBASE_AUTH_DOMAIN}
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET}
firebase.messaging-sender-id=${FIREBASE_MESSAGING_SENDER_ID}
firebase.app-id=${FIREBASE_APP_ID}
firebase.vapid-key=${FCM_VAPID_KEY}

# Image upload directory (relative to project root)
app.upload.image-dir=uploads/images
# Document upload directory (relative to project root)
app.upload.doc-dir=uploads/docs

# Max upload sizes
spring.servlet.multipart.max-file-size=20MB
# allow up to 10 × 1MB files per request
spring.servlet.multipart.max-request-size=105MB