<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — ChatApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ocean: #0077b6; --mid: #0096c7; --light: #90e0ef;
      --pale: #caf0f8; --bg: #f0f9ff; --surface: #ffffff;
      --text: #0d1b2a; --muted: #5d7a8a; --border: #bee3f8;
      --danger: #dc2626; --success: #059669;
    }
    body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; }

    /* NAV */
    nav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 60px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 8px rgba(0,119,182,.07);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; color: var(--ocean); font-size: 17px; }
    .brand-dot { width: 8px; height: 8px; background: var(--ocean); border-radius: 50%; }
    .nav-right { display: flex; align-items: center; gap: 14px; }
    .nav-user { font-size: 13px; color: var(--muted); }
    .nav-user strong { color: var(--text); }

    /* Bell */
    .bell-wrap { position: relative; }
    .bell-btn {
      width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid var(--border);
      background: var(--surface); cursor: pointer; display: grid; place-items: center;
      font-size: 17px; color: var(--muted); transition: all .15s;
    }
    .bell-btn:hover { border-color: var(--mid); color: var(--ocean); }
    .bell-badge {
      position: absolute; top: -5px; right: -5px;
      background: var(--ocean); color: white;
      font-size: 10px; font-weight: 600;
      border-radius: 99px; padding: 1px 5px; min-width: 18px; text-align: center;
      display: none;
    }
    .bell-badge.show { display: block; }
    .logout-btn {
      padding: 7px 14px; border-radius: 8px; background: none;
      border: 2px solid var(--border); color: var(--muted);
      font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* Notification drawer */
    .notif-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.15); z-index: 200; }
    .notif-overlay.open { display: block; }
    .notif-drawer {
      position: fixed; top: 0; right: -380px; bottom: 0; width: 360px;
      background: var(--surface); border-left: 1px solid var(--border);
      box-shadow: -4px 0 24px rgba(0,119,182,.1);
      z-index: 201; transition: right .3s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column;
    }
    .notif-drawer.open { right: 0; }
    .notif-head {
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .notif-head h2 { font-size: 16px; font-weight: 600; color: var(--text); }
    .notif-close {
      background: none; border: none; cursor: pointer; font-size: 20px;
      color: var(--muted); width: 32px; height: 32px; border-radius: 6px;
      display: grid; place-items: center; transition: background .15s;
    }
    .notif-close:hover { background: var(--bg); }
    .notif-list { flex: 1; overflow-y: auto; padding: 10px; }
    .notif-item {
      padding: 13px 14px; border-radius: 10px; margin-bottom: 6px;
      border: 1px solid var(--border); cursor: pointer; transition: background .15s;
      display: flex; gap: 12px; align-items: flex-start;
    }
    .notif-item:hover { background: var(--bg); }
    .notif-item.unread { background: #eff6ff; border-color: #bfdbfe; }
    .n-av {
      width: 36px; height: 36px; border-radius: 9px; flex-shrink: 0;
      background: var(--pale); color: var(--ocean); display: grid;
      place-items: center; font-weight: 600; font-size: 13px;
    }
    .n-info .n-name { font-size: 13px; font-weight: 500; }
    .n-info .n-preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
    .notif-empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
    .mark-all-btn {
      margin: 10px; padding: 9px; text-align: center;
      border: 2px solid var(--border); border-radius: 8px;
      font-size: 12px; color: var(--ocean); cursor: pointer;
      background: none; font-family: 'Inter', sans-serif; transition: background .15s; flex-shrink: 0;
    }
    .mark-all-btn:hover { background: var(--bg); }
    .quick-reply { padding: 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .quick-reply p { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
    .quick-row { display: flex; gap: 6px; }
    .quick-row input {
      flex: 1; background: var(--bg); border: 2px solid var(--border); border-radius: 7px;
      color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 8px 11px; outline: none;
    }
    .quick-row input:focus { border-color: var(--mid); }
    .quick-row button {
      background: var(--ocean); border: none; border-radius: 7px; color: white;
      font-family: 'Inter', sans-serif; font-size: 12px; padding: 8px 14px; cursor: pointer;
    }

    /* MAIN */
    main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
    .greeting { margin-bottom: 28px; }
    .greeting h2 { font-size: 24px; font-weight: 600; color: var(--text); }
    .greeting p { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; border-top: 3px solid var(--ocean);
    }
    .stat .val { font-size: 28px; font-weight: 600; color: var(--ocean); }
    .stat .val.clock { font-size: 20px; font-family: 'Inter', monospace; letter-spacing: .03em; }
    .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }

    .chat-cta {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 24px 28px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; margin-bottom: 28px;
    }
    .chat-cta h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .chat-cta p { font-size: 13px; color: var(--muted); }
    .go-btn {
      background: var(--ocean); color: white; border: none; border-radius: 8px;
      padding: 11px 22px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; white-space: nowrap; text-decoration: none; display: inline-block; transition: background .15s;
    }
    .go-btn:hover { background: #005f92; }

    .profile-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px;
    }
    .profile-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .pf { display: flex; flex-direction: column; gap: 4px; }
    .pf label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .pf span { font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 9px 12px; }

    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      background: var(--surface); border: 1px solid var(--border);
      border-left: 4px solid var(--ocean); border-radius: 10px;
      padding: 13px 17px; box-shadow: 0 4px 20px rgba(0,0,0,.1);
      font-size: 13px; max-width: 300px; transform: translateX(120%); transition: transform .3s ease;
    }
    .toast.show { transform: translateX(0); }
    .toast .t-title { font-weight: 500; margin-bottom: 2px; }
    .toast .t-body { color: var(--muted); }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="brand"><div class="brand-dot"></div>ChatApp</div>
  <div class="nav-right">
    <span class="nav-user">Hello, <strong th:text="${user.firstName}">User</strong></span>
    <div class="bell-wrap">
      <button class="bell-btn" onclick="toggleDrawer()">🔔
        <span class="bell-badge" id="bellBadge"
              th:classappend="${totalUnread > 0} ? 'show'"
              th:text="${totalUnread > 0} ? ${totalUnread} : ''"></span>
      </button>
    </div>
    <form th:action="@{/logout}" method="post" style="margin:0">
      <button class="logout-btn" type="submit">Sign out</button>
    </form>
  </div>
</nav>

<!-- Notification Drawer -->
<div class="notif-overlay" id="notifOverlay" onclick="toggleDrawer()"></div>
<aside class="notif-drawer" id="notifDrawer">
  <div class="notif-head">
    <h2>Messages</h2>
    <button class="notif-close" onclick="toggleDrawer()">✕</button>
  </div>
  <div class="notif-list" id="notifList">
    <div class="notif-empty">No new messages</div>
  </div>
  <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
  <div class="quick-reply">
    <p>Quick Reply to Admin</p>
    <div class="quick-row">
      <label for="qMsg"></label><input type="text" id="qMsg" placeholder="Type a message…" onkeydown="if(event.key==='Enter')quickReply()"/>
      <button onclick="quickReply()">Send</button>
    </div>
  </div>
</aside>

<!-- MAIN -->
<main>
  <div class="greeting">
    <h2 th:text="'Welcome back, ' + ${user.firstName} + '!'">Welcome back!</h2>
    <p id="dateStr">Loading...</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="val" id="unreadVal" th:text="${totalUnread}">0</div>
      <div class="lbl">Unread Messages</div>
    </div>
    <div class="stat">
      <div class="val" th:text="${user.role}">USER</div>
      <div class="lbl">Your Role</div>
    </div>
    <div class="stat">
      <div class="val clock" id="clockVal">--:--:--</div>
      <div class="lbl">Local Time</div>
    </div>
  </div>

  <div class="chat-cta">
    <div>
      <h3>Open Conversations</h3>
      <p>Chat with admins or other users in real time.</p>
    </div>
    <a class="go-btn" href="/user/chat">Open Chat →</a>
  </div>

  <div class="profile-card">
    <h3>Your Profile</h3>
    <div class="profile-grid">
      <div class="pf"><label>First Name</label><span th:text="${user.firstName}">—</span></div>
      <div class="pf"><label>Last Name</label><span th:text="${user.lastName}">—</span></div>
      <div class="pf"><label>Email</label><span th:text="${user.email}">—</span></div>
      <div class="pf"><label>Role</label><span th:text="${user.role}">—</span></div>
    </div>
  </div>
</main>

<div class="toast" id="toast">
  <div class="t-title" id="toastTitle"></div>
  <div class="t-body" id="toastBody"></div>
</div>

<script th:inline="javascript">
  window.FB = {
    apiKey:            /*[[${fbApiKey}]]*/ '',
    authDomain:        /*[[${fbAuthDomain}]]*/ '',
    projectId:         /*[[${fbProjectId}]]*/ '',
    storageBucket:     /*[[${fbStorageBucket}]]*/ '',
    messagingSenderId: /*[[${fbSenderId}]]*/ '',
    appId:             /*[[${fbAppId}]]*/ ''
  };
  window.VAPID = /*[[${fbVapidKey}]]*/ '';
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
  // Running clock
  function tickClock() {
    var n = new Date();
    document.getElementById('clockVal').textContent =
            String(n.getHours()).padStart(2,'0')   + ':' +
            String(n.getMinutes()).padStart(2,'0') + ':' +
            String(n.getSeconds()).padStart(2,'0');
  }
  tickClock(); setInterval(tickClock, 1000);
  document.getElementById('dateStr').textContent =
          new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  // Drawer
  function toggleDrawer() {
    document.getElementById('notifDrawer').classList.toggle('open');
    document.getElementById('notifOverlay').classList.toggle('open');
    if (document.getElementById('notifDrawer').classList.contains('open')) fetchUnreadList();
  }

  // Load unread messages into notification drawer
  async function fetchUnreadList() {
    const res  = await fetch('/api/chat/unread-list');
    const messages = await res.json();
    const list = document.getElementById('notifList');
    updateBadge(messages.length);
    if (!messages.length) { list.innerHTML = '<div class="notif-empty">No new messages 🎉</div>'; return; }
    list.innerHTML = messages.map(function(m) {
      return '<div class="notif-item unread" onclick="goToChat(\'' + esc(m.fromEmail) + '\')">'
              + '<div class="n-av">' + (m.fromName ? m.fromName[0].toUpperCase() : '?') + '</div>'
              + '<div class="n-info">'
              +   '<div class="n-name">' + esc(m.fromName) + '</div>'
              +   '<div class="n-preview">' + esc(m.content) + '</div>'
              + '</div></div>';
    }).join('');
  }

  function goToChat(email) {
    window.location.href = '/user/chat?open=' + encodeURIComponent(email);
  }

  async function markAllRead() {
    const res   = await fetch('/api/chat/unread-list');
    const messages  = await res.json();
    const emails = [...new Set(messages.map(function(m){ return m.fromEmail; }))];
    await Promise.all(emails.map(function(e) {
      return fetch('/api/chat/read?sender=' + encodeURIComponent(e), { method: 'POST' });
    }));
    updateBadge(0);
    document.getElementById('notifList').innerHTML = '<div class="notif-empty">All caught up 🎉</div>';
  }

  // Update both the bell badge AND the stat card
  function updateBadge(n) {
    var b = document.getElementById('bellBadge');
    b.textContent = n > 0 ? n : '';
    b.classList.toggle('show', n > 0);
    document.getElementById('unreadVal').textContent = n;
  }

  // Quick reply to first admin via WebSocket
  async function quickReply() {
    var content = document.getElementById('qMsg').value.trim();
    if (!content || !window.stompClient || !window.stompClient.connected) return;
    // Find an admin from the contact list — fetch total unread to get admin email
    // Instead: hardcode route to /user/chat and let user pick there, OR:
    const res      = await fetch('/api/chat/unread-list');
    const unread   = await res.json();
    // Try to find an admin from unread senders first, then fall back to first available
    var adminEmail = null;
    for (var i = 0; i < unread.length; i++) {
      // We can't know role from unread-list DTO easily — just send to any unread sender
      adminEmail = unread[i].fromEmail;
      break;
    }
    if (!adminEmail) { showToast('No admin found', 'Open the chat to select a recipient.'); return; }
    window.stompClient.send('/app/chat.send', {}, JSON.stringify({ toEmail: adminEmail, content: content }));
    document.getElementById('qMsg').value = '';
    showToast('Sent', 'Message delivered.');
  }

  function showToast(title, body, onClick) {
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastBody').textContent  = body;
    var t = document.getElementById('toast');
    t.style.cursor = onClick ? 'pointer' : '';
    t.onclick = onClick || null;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 3500);
  }

  function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // WebSocket for live badge updates on the dashboard
  function connectWS() {
    var jwt  = document.cookie.split(';').map(function(c){ return c.trim(); }).find(function(c){ return c.startsWith('jwt_token='); });
    var token = jwt ? jwt.split('=')[1] : '';
    var sock  = new SockJS('/ws');
    window.stompClient = Stomp.over(sock);
    window.stompClient.debug = null;
    window.stompClient.connect({ jwt: token }, function() {
      window.stompClient.subscribe('/user/queue/messages', function(frame) {
        var msg = JSON.parse(frame.body);
        if (!msg.mine) {
          var sender = msg.fromEmail;
          var senderName = msg.fromName || 'someone';
          showToast('New message from ' + senderName, msg.content, function() {
            window.location.href = '/user/chat?open=' + encodeURIComponent(sender);
          });
          // Browser notification — clicking opens the chat thread
          if (Notification.permission === 'granted') {
            try {
              var notif = new Notification('New message from ' + senderName, {
                body: msg.content,
                icon: 'https://cdn-icons-png.flaticon.com/512/733/733585.png',
                tag:  'chat-' + sender,
                renotify: true
              });
              notif.onclick = function() {
                window.focus();
                window.location.href = '/user/chat?open=' + encodeURIComponent(sender);
                notif.close();
              };
            } catch(e) {}
          }
          fetch('/api/chat/unread-total')
                  .then(function(r){ return r.json(); })
                  .then(function(d){ updateBadge(d.total || 0); });
        }
      });
    }, function() { setTimeout(connectWS, 3000); });
  }
  connectWS();

  // Firebase Push
  async function initFCM() {
    if (!window.FB.apiKey) return;
    try {
      const { initializeApp }                    = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
      const { getMessaging, getToken, onMessage } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js');
      const app       = initializeApp(window.FB);
      const messaging = getMessaging(app);
      const perm      = await Notification.requestPermission();
      if (perm === 'granted') {
        const reg   = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        const token = await getToken(messaging, { vapidKey: window.VAPID, serviceWorkerRegistration: reg });
        if (token) await fetch('/fcm/token', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) });
        onMessage(messaging, function(p){ showToast(p.notification?.title || 'New message', p.notification?.body || ''); });
      }
    } catch(e) { console.warn('FCM:', e.message); }
  }
  initFCM();

  // Poll badge every 10 seconds via the lightweight total endpoint
  setInterval(function() {
    fetch('/api/chat/unread-total')
            .then(function(r){ return r.json(); })
            .then(function(d){ updateBadge(d.total || 0); });
  }, 10000);
</script>
</body>
</html>
