<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chat — ChatApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

        :root {
            --ocean: #0077b6;
            --mid: #0096c7;
            --light: #90e0ef;
            --pale: #caf0f8;
            --bg: #f0f9ff;
            --surface: #ffffff;
            --text: #0d1b2a;
            --muted: #5d7a8a;
            --border: #bee3f8;
            --mine-bg: #0077b6;
            --mine-text: #fff;
            --their-bg: #f1f5f9;
            --their-text: #0d1b2a;
            --danger: #dc2626;
        }

        html, body { height: 100%; overflow: hidden }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column }

        /* TOPBAR */
        .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; box-shadow: 0 1px 6px rgba(0,119,182,.07) }
        .topbar-left { display: flex; align-items: center; gap: 14px }
        .back-btn { display: flex; align-items: center; gap: 5px; color: var(--ocean); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 10px; border-radius: 7px; transition: background .15s }
        .back-btn:hover { background: var(--bg) }
        .brand { font-weight: 600; color: var(--ocean); font-size: 16px; display: flex; align-items: center; gap: 8px }
        .role-chip { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; padding: 2px 9px; border-radius: 99px }
        .role-chip.admin { background: #fef3c7; color: #92400e; border: 1px solid #fde68a }
        .role-chip.user  { background: #eff6ff; color: var(--ocean); border: 1px solid #bfdbfe }
        .topbar-right { display: flex; align-items: center; gap: 10px }
        .me-chip { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 4px 11px }
        .logout-btn { background: none; border: 2px solid var(--border); border-radius: 7px; color: var(--muted); font-family: 'Inter',sans-serif; font-size: 12px; padding: 5px 11px; cursor: pointer; transition: all .15s }
        .logout-btn:hover { border-color: var(--danger); color: var(--danger) }

        /* LAYOUT */
        .chat-layout { display: flex; flex: 1; overflow: hidden }

        /* SIDEBAR */
        .sidebar { width: 270px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column }
        .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border) }
        .sidebar-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px }
        .search-input { width: 100%; background: var(--bg); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Inter',sans-serif; font-size: 13px; padding: 8px 11px; outline: none; transition: border-color .15s }
        .search-input:focus { border-color: var(--mid) }
        .contact-list { flex: 1; overflow-y: auto; padding: 8px }
        .contact-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 9px; cursor: pointer; transition: background .15s, transform .12s; margin-bottom: 2px }
        .contact-item:hover { background: var(--bg); transform: translateY(-1px) }
        .contact-item.active { background: #eff6ff }
        .c-av { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; background: var(--pale); color: var(--ocean); display: grid; place-items: center; font-weight: 600; font-size: 14px }
        .c-av.admin { background: #fef3c7; color: #92400e }
        .c-info { overflow: hidden; flex: 1; min-width: 0 }
        .c-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        .c-role { font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-top: 1px }
        .c-preview { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px }
        .c-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0 }
        .c-time { font-size: 10px; color: var(--muted) }
        .c-badge { background: var(--ocean); color: #fff; font-size: 10px; font-weight: 600; border-radius: 99px; padding: 1px 6px; min-width: 18px; text-align: center; display: none }
        .c-badge.show { display: block }

        /* CHAT AREA */
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0 }
        .chat-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0 }
        .ch-av { width: 36px; height: 36px; border-radius: 9px; background: var(--pale); color: var(--ocean); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex-shrink: 0 }
        .ch-av.admin { background: #fef3c7; color: #92400e }
        .ch-name { font-size: 14px; font-weight: 600 }
        .ch-sub { font-size: 11px; color: var(--mid); margin-top: 1px }
        .online-dot  { display: inline-block; width: 7px; height: 7px; background: #059669; border-radius: 50%; margin-right: 4px }
        .offline-dot { display: inline-block; width: 7px; height: 7px; background: #94a3b8; border-radius: 50%; margin-right: 4px }

        .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; background: var(--bg); min-height: 0 }
        .messages::-webkit-scrollbar { width: 4px }
        .messages::-webkit-scrollbar-thumb { background: var(--light); border-radius: 2px }

        .no-chat { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--muted) }
        .no-chat .nc-icon { font-size: 40px; opacity: .4 }
        .no-chat p { font-size: 14px }

        /* MESSAGES */
        .msg { display: flex; flex-direction: row; align-items: flex-start; gap: 4px; max-width: min(68%, 520px); animation: msgIn .18s ease }
        .msg.mine   { align-self: flex-end;  align-items: flex-end }
        .msg.theirs { align-self: flex-start; align-items: flex-start }
        @keyframes msgIn { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:translateY(0) } }

        .msg-name { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 3px; padding: 0 4px }
        .bubble { padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-break: break-word }
        .msg.mine   .bubble { background: var(--mine-bg); color: var(--mine-text); border-bottom-right-radius: 4px }
        .msg.theirs .bubble { background: var(--their-bg); color: var(--their-text); border-bottom-left-radius: 4px; border: 1px solid var(--border) }
        .msg-foot { font-size: 10px; color: var(--muted); margin-top: 3px; padding: 0 4px; display: flex; align-items: center; gap: 3px }
        .tick-single { color: #94a3b8; font-size: 11px }
        .tick-double { color: var(--ocean); font-size: 11px; font-weight: 700 }

        /* ── ATTACH BUTTON + POPOVER MENU ─────────────────────────────────── */
        .attach-wrap { position: relative; flex-shrink: 0 }

        .attach-btn {
            width: 42px; height: 42px; border-radius: 10px;
            background: var(--bg); color: var(--muted);
            border: 1.5px solid var(--border);
            display: grid; place-items: center;
            cursor: pointer;
            transition: all .15s;
        }
        .attach-btn:hover, .attach-btn.open {
            border-color: var(--mid); color: var(--ocean); background: #fff;
        }

        /* Popover */
        .attach-popover {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            min-width: 210px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(0,0,0,.14);
            overflow: hidden;
            z-index: 300;
            animation: popIn .14s ease;
        }
        @keyframes popIn { from { opacity:0; transform:translateY(6px) scale(.97) } to { opacity:1; transform:translateY(0) scale(1) } }

        .attach-popover-item {
            display: flex; align-items: center; gap: 13px;
            padding: 13px 18px;
            font-size: 13px; font-weight: 500;
            color: var(--text);
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: background .12s;
        }
        .attach-popover-item:last-child { border-bottom: none }
        .attach-popover-item:hover { background: var(--bg) }

        .attach-popover-item .ap-icon {
            width: 34px; height: 34px; border-radius: 9px;
            display: grid; place-items: center;
            font-size: 16px; flex-shrink: 0;
        }
        .ap-icon.photos  { background: #ffe4e6; color: #e11d48 }
        .ap-icon.docs    { background: #e0f2fe; color: #0284c7 }
        .ap-icon.audio   { background: #f3e8ff; color: #9333ea }

        /* ── PREVIEW BAR (shared for images + docs) ───────────────────────── */
        .img-preview-bar {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 8px 14px;
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .preview-thumbs { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px 0 }

        /* Image thumb */
        .preview-thumb { position: relative; flex-shrink: 0 }
        .preview-thumb img { width: 52px; height: 52px; object-fit: cover; border-radius: 7px; border: 1.5px solid var(--border); display: block; background: #e2e8f0 }

        /* Document thumb */
        .preview-doc-thumb {
            position: relative; flex-shrink: 0;
            display: flex; align-items: center; gap: 8px;
            background: var(--bg); border: 1.5px solid var(--border);
            border-radius: 8px; padding: 6px 10px;
            max-width: 180px;
        }
        .preview-doc-thumb .doc-icon-sm { font-size: 22px; flex-shrink: 0 }
        .preview-doc-thumb .doc-name-sm { font-size: 11px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px }

        .remove-thumb {
            position: absolute; top: -6px; right: -6px;
            width: 17px; height: 17px;
            background: var(--danger); color: #fff; border: none; border-radius: 50%;
            font-size: 10px; font-weight: 700; cursor: pointer;
            display: grid; place-items: center; line-height: 1; padding: 0;
        }

        .preview-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; align-items: flex-end }
        .img-upload-progress { font-size: 11px; color: var(--muted); white-space: nowrap }
        .cancel-img { background: none; border: 1.5px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 3px 9px; font-size: 11px; font-family: 'Inter',sans-serif; transition: all .15s; white-space: nowrap }
        .cancel-img:hover { border-color: var(--danger); color: var(--danger) }

        /* ── IMAGE GRID IN BUBBLE ──────────────────────────────────────────── */
        .img-grid { display: grid; gap: 3px; border-radius: 10px; overflow: hidden; max-width: min(240px,100%) }
        .img-grid-1 { grid-template-columns: 1fr }
        .img-grid-2, .img-grid-3, .img-grid-4 { grid-template-columns: 1fr 1fr }
        .img-grid .chat-img { width:100%; height:110px; object-fit:cover; display:block; cursor:zoom-in; transition:opacity .15s }
        .img-grid .chat-img:hover { opacity:.88 }
        .img-grid-1 .chat-img { height:175px }
        .img-grid-3 .chat-img:first-child { grid-column:span 2; height:135px }
        .img-more { background:rgba(0,0,0,.48); color:#fff; display:grid; place-items:center; font-size:15px; font-weight:600; cursor:default; height:110px }
        .img-caption { margin-top:6px; font-size:14px; line-height:1.5; word-break:break-word; padding:0 2px }

        /* ── DOCUMENT BUBBLE ──────────────────────────────────────────────── */
        .doc-list { display: flex; flex-direction: column; gap: 5px; max-width: min(280px, 100%) }

        .doc-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 10px;
            text-decoration: none;
            transition: opacity .15s, background .15s;
            cursor: pointer;
        }
        /* Mine: white/translucent on blue */
        .msg.mine  .doc-item { background: rgba(255,255,255,.18); color: #fff }
        .msg.mine  .doc-item:hover { background: rgba(255,255,255,.28) }
        /* Theirs: subtle grey */
        .msg.theirs .doc-item { background: rgba(0,119,182,.07); color: var(--text); border: 1px solid var(--border) }
        .msg.theirs .doc-item:hover { background: rgba(0,119,182,.12) }

        .doc-item .doc-icon  { font-size: 26px; flex-shrink: 0; line-height: 1 }
        .doc-item .doc-info  { flex: 1; overflow: hidden }
        .doc-item .doc-name  { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
        .doc-item .doc-type  { font-size: 10px; opacity: .7; margin-top: 2px; text-transform: uppercase; letter-spacing: .05em }
        .doc-item .doc-dl    { font-size: 14px; flex-shrink: 0; opacity: .65 }

        .doc-caption { margin-top: 6px; font-size: 14px; line-height: 1.5; word-break: break-word; padding: 0 2px }

        /* ── BUBBLE WRAPPER + MENU BTN ────────────────────────────────────── */
        /* ── BUBBLE WRAPPER ───────────────────────────────────────────────────── */
        .bubble-wrap { position: relative; display: inline-block; max-width: 100% }

        .msg-row { display: flex; align-items: flex-end; gap: 4px; max-width: 100% }
        .msg.mine  .msg-row { flex-direction: row-reverse }
        .msg.theirs .msg-row { flex-direction: row }

        .msg-menu-btn {
            flex-shrink: 0; align-self: center;
            width: 26px; height: 26px; border: none; border-radius: 50%;
            background: transparent; color: var(--muted);
            display: grid; place-items: center;
            cursor: pointer; opacity: 0;
            font-size: 13px;
            transition: opacity .15s, background .15s;
        }
        .msg:hover .msg-menu-btn { opacity: 1 }
        .msg-menu-btn:hover { background: var(--border); color: var(--ocean); }

        /* ── DOCUMENT BUBBLE ─────────────────────────────────────────────────── */
        /* ── DOCUMENT BUBBLE ──────────────────────────────────────────────── */
        .doc-list { display: flex; flex-direction: column; gap: 5px; max-width: min(280px, 100%) }

        .doc-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 10px;
            text-decoration: none;
            transition: background .15s;
            cursor: pointer;
        }

        /* Receiver side — subtle tinted card */
        .msg.theirs .doc-item {
            background: rgba(0,119,182,.07);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .msg.theirs .doc-item:hover { background: rgba(0,119,182,.13); }

        /* Sender side — clean white card on blue bubble */
        .msg.mine .doc-item {
            background: rgba(255,255,255,.92);
            color: var(--ocean);
            border: 1px solid rgba(255,255,255,.5);
        }
        .msg.mine .doc-item:hover { background: #ffffff; }
        .msg.mine .doc-item .doc-name { color: var(--ocean); }
        .msg.mine .doc-ext-badge { color: var(--muted); }

        /* ── When sender bubble contains ONLY docs (no image, no text caption)   */
        /* ── swap the heavy blue for a soft light background                     */
        .msg.mine .bubble:has(> .doc-list:only-child) {
            background: #e8f4fd;
            border: 1.5px solid var(--border);
            color: var(--text);
        }

        .doc-item .doc-icon-fa {
            font-size: 22px; flex-shrink: 0; line-height: 1;
            width: 30px; text-align: center;
            display: flex; flex-direction: column; align-items: center;
        }
        .doc-ext-badge {
            font-size: 7px; font-weight: 700; letter-spacing: .03em;
            margin-top: 2px; color: var(--muted); line-height: 1; text-transform: uppercase;
        }
        .doc-item .doc-info  { flex: 1; overflow: hidden }
        .doc-item .doc-name  {
            font-size: 13px; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
        }
        .doc-caption { margin-top: 6px; font-size: 14px; line-height: 1.5; word-break: break-word; padding: 0 2px }

        /* ── CONTEXT MENU ─────────────────────────────────────────────────── */
        .msg-ctx-menu { position: fixed; z-index: 2000; min-width: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.16); animation: ctxIn .14s ease }
        @keyframes ctxIn { from { opacity:0; transform:scale(.96) translateY(-6px) } to { opacity:1; transform:scale(1) translateY(0) } }
        .msg-ctx-item { display: flex; align-items: center; gap: 11px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); cursor: pointer; transition: background .12s }
        .msg-ctx-item:last-child { border-bottom: none }
        .msg-ctx-item:hover { background: var(--bg) }
        .msg-ctx-item.danger { color: var(--danger) }

        /* ── INPUT ────────────────────────────────────────────────────────── */
        .input-area { background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0 }
        .msg-input { flex: 1; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Inter',sans-serif; font-size: 14px; padding: 10px 14px; outline: none; resize: none; max-height: 120px; min-height: 42px; line-height: 1.4; transition: border-color .15s; overflow-y: auto }
        .msg-input:focus { border-color: var(--mid); background: #fff }
        .msg-input::placeholder { color: var(--muted) }
        .msg-input::-webkit-scrollbar { width: 4px }
        .msg-input::-webkit-scrollbar-track { background: transparent }
        .msg-input::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px }
        .msg-input::-webkit-scrollbar-thumb:hover { background: var(--light) }
        .send-btn { width: 42px; height: 42px; border-radius: 10px; background: var(--ocean); color: #fff; border: none; display: grid; place-items: center; cursor: pointer; font-size: 17px; flex-shrink: 0; transition: background .15s }
        .send-btn:hover { background: #005f92 }

        /* STATUS BAR */
        .status-bar { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 16px; font-size: 12px; color: var(--muted); display: none; align-items: center; gap: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.08); z-index: 50 }
        .status-bar.show { display: flex }
        .s-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ocean); animation: blink 1.2s ease infinite }
        .s-dot:nth-child(2) { animation-delay: .2s }
        .s-dot:nth-child(3) { animation-delay: .4s }
        @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.3 } }

        /* LIGHTBOX */
        .img-lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: flex; align-items: center; justify-content: center; z-index: 9999; cursor: zoom-out }
        .img-lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; object-fit: contain; cursor: default }
        .lightbox-close { position: absolute; top: 18px; right: 22px; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 28px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; line-height: 1 }
        .lightbox-close:hover { background: rgba(255,255,255,.25) }

        /* DELETED */
        .bubble-deleted { background: transparent !important; border: 1.5px dashed #cbd5e1 !important; color: var(--muted) !important; font-style: italic; font-size: 13px; padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; gap: 6px; pointer-events: none; user-select: none }
        .msg.mine .bubble-deleted { background: rgba(0,119,182,.42) !important; border-color: rgba(255,255,255,.48) !important; color: rgba(255,255,255,.90) !important }
    </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
    <div class="topbar-left">
        <a class="back-btn"
           th:href="${#authorization.expression('hasRole(''ADMIN'')')} ? @{/admin/dashboard} : @{/user/dashboard}">
            ← Dashboard
        </a>
        <div class="brand">
            ChatApp
            <span class="role-chip admin" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Admin</span>
            <span class="role-chip user"  th:unless="${#authorization.expression('hasRole(''ADMIN'')')}">User</span>
        </div>
    </div>
    <div class="topbar-right">
        <span class="me-chip" th:text="${me.fullName()}">Me</span>
        <form th:action="@{/logout}" method="post">
            <button class="logout-btn" type="submit">Sign out</button>
        </form>
    </div>
</div>

<!-- CHAT LAYOUT -->
<div class="chat-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Conversations</div>
            <label>
                <input class="search-input" type="text" placeholder="Search contacts…"
                       oninput="filterContacts(this.value)"/>
            </label>
        </div>
        <div class="contact-list" id="contactList">
            <div th:each="c : ${contacts}"
                 class="contact-item"
                 th:id="'c-' + ${c.email}"
                 th:attr="data-email=${c.email},
                    data-name=${c.fullName()},
                    data-initials=${c.initials()},
                    data-role=${c.role},
                    data-search=${c.fullName().toLowerCase() + ' ' + c.email.toLowerCase()},
                    data-lasttime='0'"
                 onclick="openChat(this)">
                <div class="c-av" th:classappend="${c.role.name() == 'ADMIN'} ? ' admin'">
                    <span th:text="${c.initials()}">AB</span>
                </div>
                <div class="c-info">
                    <div class="c-name"    th:text="${c.fullName()}">Name</div>
                    <div class="c-role"    th:text="${c.role}">USER</div>
                    <div class="c-preview" th:id="'prev-' + ${c.email}">Click to chat</div>
                </div>
                <div class="c-right">
                    <span class="presence-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-bottom:4px"></span>
                    <span class="c-time"  th:id="'time-'  + ${c.email}"></span>
                    <span class="c-badge" th:id="'badge-' + ${c.email}"
                          th:classappend="${unreadCounts[c.email] != null and unreadCounts[c.email] > 0} ? ' show'"
                          th:text="${unreadCounts[c.email] != null and unreadCounts[c.email] > 0} ? ${unreadCounts[c.email]} : ''">
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="no-chat">
            <div class="nc-icon">💬</div>
            <p>Select a conversation to start chatting</p>
        </div>
    </div>
</div>

<div class="status-bar" id="statusBar">
    <div class="s-dot"></div><div class="s-dot"></div><div class="s-dot"></div>
    <span id="statusText">Connecting…</span>
</div>

<script th:inline="javascript">
    window.ME_EMAIL   = /*[[${me.email}]]*/   '';
    window.ME_NAME    = /*[[${me.fullName()}]]*/ '';
    window.ME_INIT    = /*[[${me.initials()}]]*/ '';
    window.OPEN_EMAIL = new URLSearchParams(location.search).get('open') || '';
    window.FB_CONFIG  = {
        apiKey:            /*[[${fbApiKey}]]*/ '',
        authDomain:        /*[[${fbAuthDomain}]]*/ '',
        projectId:         /*[[${fbProjectId}]]*/ '',
        storageBucket:     /*[[${fbStorageBucket}]]*/ '',
        messagingSenderId: /*[[${fbMessagingSenderId}]]*/ '',
        appId:             /*[[${fbAppId}]]*/ ''
    };
    window.VAPID_KEY = /*[[${fbVapidKey}]]*/ '';
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script>
    'use strict';

    var stompClient  = null;
    var currentEmail = null;
    var renderedIds  = new Set();

    // ── WebSocket connect ────────────────────────────────────────────────────────
    function connect() {
        showStatus('Connecting…');
        var sock = new SockJS('/ws');
        stompClient = Stomp.over(sock);
        stompClient.debug = null;
        stompClient.heartbeat.outgoing = 20000;
        stompClient.heartbeat.incoming = 20000;
        stompClient.connect({jwt: getCookie('jwt_token')}, onConnected, function () {
            showStatus('Reconnecting…');
            setTimeout(connect, 3000);
            window.addEventListener('online', function () {
                if (!stompClient || !stompClient.connected) connect();
            });
        });
    }

    function onConnected() {
        hideStatus();

        stompClient.subscribe('/user/queue/messages', function (frame) {
            handleIncoming(JSON.parse(frame.body));
        });

        stompClient.subscribe('/topic/presence', function (frame) {
            var data = JSON.parse(frame.body);
            applyPresence(data.email, data.status);
        });

        stompClient.subscribe('/user/queue/read', function (frame) {
            var data = JSON.parse(frame.body);
            if (data.messageId) {
                var msg = document.getElementById('msg-' + data.messageId);
                if (msg) {
                    var tick = msg.querySelector('.tick-single');
                    if (tick) { tick.className = 'tick-double'; tick.textContent = '✓✓'; }
                }
            }
        });

        stompClient.subscribe('/user/queue/deleted', function (frame) {
            var data = JSON.parse(frame.body);
            markAsDeleted(document.getElementById('msg-' + data.messageId));
        });

        loadUnreadCounts();
        loadInitialPresence();
        loadConversations();

        if (window.OPEN_EMAIL) {
            var el = document.getElementById('c-' + window.OPEN_EMAIL);
            if (el) openChat(el);
        }
    }

    // ── Open a chat thread ───────────────────────────────────────────────────────
    function openChat(el) {
        var email    = el.dataset.email;
        var name     = el.dataset.name;
        var initials = el.dataset.initials;
        var role     = el.dataset.role;

        localStorage.setItem('chat_open_' + window.ME_EMAIL, email);

        if (currentEmail === email && document.getElementById('msgList')) {
            var inp = document.getElementById('msgInput');
            if (inp) inp.focus();
            return;
        }

        currentEmail = email;
        renderedIds  = new Set();

        document.querySelectorAll('.contact-item').forEach(function (i) { i.classList.remove('active'); });
        el.classList.add('active');

        var badge = document.getElementById('badge-' + email);
        if (badge) { badge.textContent = ''; badge.classList.remove('show'); }

        var isOnline   = onlineSet.has(email);
        var statusHtml = isOnline
            ? '<span class="online-dot"></span>Online'
            : '<span class="offline-dot"></span>Offline';

        var avCls   = (role === 'ADMIN') ? 'ch-av admin' : 'ch-av';
        var rolePill = (role === 'ADMIN')
            ? '<span style="font-size:10px;font-weight:600;background:#fef3c7;color:#92400e;border-radius:99px;padding:1px 7px;margin-left:6px">Admin</span>'
            : '';

        document.getElementById('chatArea').innerHTML =
            '<div class="chat-header">'
            + '<div class="' + avCls + '">' + esc(initials) + '</div>'
            + '<div style="flex:1">'
            + '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">'
            + '<div class="ch-name">' + esc(name) + rolePill + '</div>'
            + '<button onclick="closeChat()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#64748b;padding:0 6px">&times;</button>'
            + '</div>'
            + '<div class="ch-sub">' + statusHtml + '</div>'
            + '</div>'
            + '</div>'
            + '<div class="messages" id="msgList"></div>'

            // Hidden file pickers (images + documents)
            + '<input type="file" id="imgPicker" accept="image/jpeg,image/png,image/gif,image/webp" multiple style="display:none" onchange="handleImagePick(this)"/>'
            + '<input type="file" id="docPicker" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.json,.xml,.zip,.rar,.7z,.rtf,.odt,.ods" multiple style="display:none" onchange="handleDocPick(this)"/>'

            // Input bar with attach-wrap instead of bare attach-btn
            + '<div class="input-area">'
            + '<div class="attach-wrap" id="attachWrap">'
            + '  <button class="attach-btn" id="attachBtn" onclick="toggleAttachMenu(event)" title="Attach">'
            + '    <i class="fa-solid fa-paperclip"></i>'
            + '  </button>'
            + '</div>'
            + '<textarea class="msg-input" id="msgInput" placeholder="Type a message…" rows="1"'
            + ' onkeydown="onKey(event)" oninput="autoH(this)"></textarea>'
            + '<button class="send-btn" onclick="sendMsg()">&#10148;</button>'
            + '</div>';

        fetch('/api/chat/thread?with=' + encodeURIComponent(email))
            .then(function (r) { return r.json(); })
            .then(function (msgs) {
                msgs.forEach(function (m) { appendMsg(m); });
                scrollBottom();
                return fetch('/api/chat/read?sender=' + encodeURIComponent(email), { method: 'POST' });
            })
            .then(function () {
                var b = document.getElementById('badge-' + email);
                if (b) { b.textContent = ''; b.classList.remove('show'); }
                loadUnreadCounts();
            })
            .catch(function (e) { console.error('Failed to load thread:', e); });

        document.getElementById('msgInput').focus();
    }

    function closeChat() {
        currentEmail = null;
        document.querySelectorAll('.contact-item').forEach(function (i) { i.classList.remove('active'); });
        document.getElementById('chatArea').innerHTML =
            '<div class="no-chat"><div class="nc-icon">💬</div><p>Select a conversation to start chatting</p></div>';
    }

    // ── Attach popover menu ───────────────────────────────────────────────────────
    var attachMenuOpen = false;

    function toggleAttachMenu(e) {
        e.stopPropagation();
        var wrap = document.getElementById('attachWrap');
        var btn  = document.getElementById('attachBtn');
        if (!wrap) return;

        var existing = document.getElementById('attachPopover');
        if (existing) { existing.remove(); attachMenuOpen = false; btn.classList.remove('open'); return; }

        attachMenuOpen = true;
        btn.classList.add('open');

        var pop = document.createElement('div');
        pop.className = 'attach-popover';
        pop.id = 'attachPopover';

        pop.innerHTML =
            '<div class="attach-popover-item" onclick="pickImages()">'
            + '  <span class="ap-icon photos"><i class="fa-solid fa-image"></i></span>'
            + '  <span>Photos &amp; Videos</span>'
            + '</div>'
            + '<div class="attach-popover-item" onclick="pickDocuments()">'
            + '  <span class="ap-icon docs"><i class="fa-solid fa-file-lines"></i></span>'
            + '  <span>Documents</span>'
            + '</div>';

        wrap.appendChild(pop);

        setTimeout(function () {
            document.addEventListener('click', closeAttachMenu, { once: true });
        }, 10);
    }

    function closeAttachMenu() {
        var pop = document.getElementById('attachPopover');
        if (pop) pop.remove();
        attachMenuOpen = false;
        var btn = document.getElementById('attachBtn');
        if (btn) btn.classList.remove('open');
    }

    function pickImages() {
        closeAttachMenu();
        var picker = document.getElementById('imgPicker');
        if (picker) picker.click();
    }

    function pickDocuments() {
        closeAttachMenu();
        var picker = document.getElementById('docPicker');
        if (picker) picker.click();
    }

    // ── Send a message ───────────────────────────────────────────────────────────
    function sendMsg() {
        if (!currentEmail || !stompClient || !stompClient.connected) return;

        if (pendingFiles.length > 0 || pendingDocs.length > 0) {
            uploadAndSend();
            return;
        }

        var input = document.getElementById('msgInput');
        var text  = (input.value || '').trim();
        if (!text) return;

        input.value = '';
        input.style.height = 'auto';
        input.focus();

        stompClient.send('/app/chat.send', {}, JSON.stringify({
            toEmail: currentEmail,
            content: text,
            imageUrls: [],
            documentMetas: []
        }));
    }

    // ── Handle incoming WebSocket message ────────────────────────────────────────
    function handleIncoming(msg) {
        if (!msg.sentAt) msg.sentAt = new Date().toISOString();

        var partner = msg.mine ? msg.toEmail : msg.fromEmail;

        if (partner === currentEmail) {
            appendMsg(msg);
            scrollBottom();

            if (!msg.mine) {
                fetch('/api/chat/read?sender=' + encodeURIComponent(msg.fromEmail), { method: 'POST' })
                    .then(function () {
                        var b = document.getElementById('badge-' + msg.fromEmail);
                        if (b) { b.textContent = ''; b.classList.remove('show'); }
                    });
                if (stompClient && stompClient.connected) {
                    stompClient.send('/app/chat.read', {}, JSON.stringify({
                        sender: msg.fromEmail,
                        messageId: msg.id || ''
                    }));
                }
            }
        } else if (!msg.mine) {
            var badge = document.getElementById('badge-' + partner);
            if (badge) {
                var n = parseInt(badge.textContent || '0') + 1;
                badge.textContent = n;
                badge.classList.add('show');
            }
            pushNotif('New message from ' + (msg.fromName || 'someone'), msg.content, partner);
        }

        updateSidebar(partner, msg.content, msg.sentAt, msg.imageUrls, msg.documentMetas);

        if (partner === currentEmail) {
            var b = document.getElementById('badge-' + partner);
            if (b) { b.textContent = ''; b.classList.remove('show'); }
        } else {
            loadUnreadCounts();
        }
        sortContacts();
    }

    // ── Append one message bubble ────────────────────────────────────────────────
    function appendMsg(msg) {
        var list = document.getElementById('msgList');
        if (!list) return;

        if (msg.id) {
            if (renderedIds.has(msg.id)) return;
            renderedIds.add(msg.id);
        }
        if (!msg.sentAt) msg.sentAt = new Date().toISOString();

        var mine = (msg.mine === true) || (msg.fromEmail === window.ME_EMAIL);

        var div = document.createElement('div');
        div.className = 'msg ' + (mine ? 'mine' : 'theirs');
        if (msg.id) div.id = 'msg-' + msg.id;

        // ── DELETED ──────────────────────────────────────────────────────────────
        if (msg.deleted) {
            div.dataset.mine      = mine ? '1' : '0';
            div.dataset.imageUrls = '[]';
            div.dataset.docMetas  = '[]';
            div.dataset.content   = '';

            div.innerHTML =
                (!mine ? '<div class="msg-name">' + esc(msg.fromName || '') + '</div>' : '') +
                '<div class="msg-row">' +
                '<div class="bubble-wrap"><div class="bubble bubble-deleted">' +
                '<i class="fa-solid fa-ban" style="font-size:11px;opacity:.7;flex-shrink:0"></i>' +
                'This message was deleted' +
                '</div></div>' +
                '</div>' +
                '<div class="msg-foot">' + fmtTime(msg.sentAt) + '</div>';

            requestAnimationFrame(function () { list.appendChild(div); scrollBottom(); });
            return;
        }

        // ── NORMAL ───────────────────────────────────────────────────────────────
        var urls = msg.imageUrls     || [];
        var docs = msg.documentMetas || [];

        div.dataset.mine      = mine ? '1' : '0';
        div.dataset.imageUrls = JSON.stringify(urls);
        div.dataset.docMetas  = JSON.stringify(docs);
        div.dataset.content   = msg.content || '';

        var tick = mine
            ? (msg.read
                ? '<span class="tick-double" title="Read">✓✓</span>'
                : '<span class="tick-single" title="Sent">✓</span>')
            : '';

        var bubbleContent = '';
        var hasImages = urls.length > 0;
        var hasDocs   = docs.length > 0;
        var hasText   = msg.content && msg.content.trim();

        // Images block
        if (hasImages) {
            var cnt = urls.length;
            var gridHtml = '<div class="img-grid img-grid-' + Math.min(cnt, 4) + '">';
            urls.slice(0, 4).forEach(function (url) {
                gridHtml += '<img class="chat-img" src="' + esc(url) + '" onclick="openFullImage(\'' + esc(url) + '\')" />';
            });
            if (cnt > 4) gridHtml += '<div class="img-more">+' + (cnt - 4) + '</div>';
            gridHtml += '</div>';
            bubbleContent += gridHtml;
        }

        // Documents block
        if (hasDocs) {
            bubbleContent += '<div class="doc-list">';
            docs.forEach(function (doc) {
                var ext  = doc.name && doc.name.includes('.') ? doc.name.split('.').pop().toLowerCase() : '';
                var icon = docIconFA(doc.mime, ext);
                bubbleContent +=
                    '<a class="doc-item" href="' + esc(doc.url) + '" download="' + esc(doc.name) + '" target="_blank" onclick="event.stopPropagation()">'
                    + '<span class="doc-icon-fa">' + icon + '</span>'
                    + '<span class="doc-info">'
                    + '<span class="doc-name">' + esc(doc.name) + '</span>'
                    + '</span>'
                    + '</a>';
            });
            bubbleContent += '</div>';
        }

        // Caption / text
        if (hasText) {
            if (hasImages || hasDocs) {
                bubbleContent += '<div class="' + (hasImages ? 'img-caption' : 'doc-caption') + '">' + esc(msg.content) + '</div>';
            } else {
                bubbleContent = esc(msg.content);
            }
        }

        // ── msg-row wraps bubble + ⋮ button side by side ──────────────────────
        div.innerHTML =
            (!mine ? '<div class="msg-name">' + esc(msg.fromName || '') + '</div>' : '') +
            '<div class="msg-row">' +
            '<div class="bubble-wrap"><div class="bubble">' + bubbleContent + '</div></div>' +
            '<button class="msg-menu-btn" onclick="toggleMsgMenu(event,this)" title="Options">' +
            '<i class="fa-solid fa-ellipsis-vertical"></i></button>' +
            '</div>' +
            '<div class="msg-foot">' + fmtTime(msg.sentAt) + (tick ? '&nbsp;' + tick : '') + '</div>';

        requestAnimationFrame(function () { list.appendChild(div); scrollBottom(); });
    }

    // ── Document icon picker ─────────────────────────────────────────────────────
    function docIconFA(mime, ext) {
        mime = mime || ''; ext = ext || '';

        // All icons use fa-file base — no embedded text labels
        // Colors stay within the ocean/teal theme, no jarring reds
        if (mime.includes('pdf') || ext === 'pdf')
            return '<i class="fa-solid fa-file" style="color:var(--ocean)"></i>'
                + '<span class="doc-ext-badge">PDF</span>';
        if (mime.includes('word') || mime.includes('opendocument.text') || ext === 'doc' || ext === 'docx' || ext === 'odt')
            return '<i class="fa-solid fa-file" style="color:var(--mid)"></i>'
                + '<span class="doc-ext-badge">DOC</span>';
        if (mime.includes('excel') || mime.includes('spreadsheet') || mime.includes('csv') || ext === 'xls' || ext === 'xlsx' || ext === 'csv' || ext === 'ods')
            return '<i class="fa-solid fa-file" style="color:#0891b2"></i>'
                + '<span class="doc-ext-badge">XLS</span>';
        if (mime.includes('powerpoint') || mime.includes('presentation') || ext === 'ppt' || ext === 'pptx')
            return '<i class="fa-solid fa-file" style="color:var(--light)" ></i>'
                + '<span class="doc-ext-badge">PPT</span>';
        if (mime.includes('zip') || mime.includes('rar') || mime.includes('7z') || ext === 'zip' || ext === 'rar' || ext === '7z')
            return '<i class="fa-solid fa-file-zipper" style="color:var(--muted)"></i>';
        if (mime.includes('text') || mime.includes('json') || mime.includes('xml') || ext === 'txt' || ext === 'json' || ext === 'xml' || ext === 'rtf')
            return '<i class="fa-solid fa-file-lines" style="color:var(--mid)"></i>';
        return '<i class="fa-solid fa-file" style="color:var(--muted)"></i>';
    }

    // ── Sidebar helpers ──────────────────────────────────────────────────────────
    function updateSidebar(email, preview, sentAt, imageUrls, docMetas) {
        var prev = document.getElementById('prev-' + email);
        if (prev) {
            if (docMetas && docMetas.length > 0 && (!imageUrls || imageUrls.length === 0)) {
                prev.textContent = '📎 ' + docMetas.length + (docMetas.length === 1 ? ' File' : ' Files');
            } else if (imageUrls && imageUrls.length > 0) {
                prev.textContent = imageUrls.length === 1 ? '📷 Image' : '📷 ' + imageUrls.length + ' Images';
            } else {
                prev.textContent = preview || '';
            }
        }
        var timeEl = document.getElementById('time-' + email);
        if (timeEl) timeEl.textContent = fmtTime(sentAt);

        var el = document.getElementById('c-' + email);
        if (el) {
            var ts = sentAt ? Date.parse(sentAt) : Date.now();
            el.dataset.lasttime = isNaN(ts) ? Date.now() : ts;
            sortContacts();
        }
    }

    function sortContacts() {
        var list  = document.getElementById('contactList');
        var items = Array.from(list.querySelectorAll('.contact-item'));
        items.sort(function (a, b) {
            return parseInt(b.dataset.lasttime || '0') - parseInt(a.dataset.lasttime || '0');
        });
        items.forEach(function (el) { list.appendChild(el); });
    }

    function loadUnreadCounts() {
        fetch('/api/chat/unread-all')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                Object.keys(data).forEach(function (email) {
                    var badge = document.getElementById('badge-' + email);
                    if (badge && data[email] > 0) {
                        badge.textContent = data[email];
                        badge.classList.add('show');
                    }
                });
            })
            .catch(function (e) { console.warn('unread-all:', e); });
    }

    function loadConversations() {
        fetch('/api/chat/conversations')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                data.forEach(function (c) {
                    updateSidebar(c.email, c.lastMessage, c.lastTime, c.imageUrls, []);
                    var badge = document.getElementById('badge-' + c.email);
                    if (badge && c.unread > 0) {
                        badge.textContent = c.unread;
                        badge.classList.add('show');
                    }
                });
                sortContacts();
            })
            .catch(function (err) { console.error('Conversation load failed:', err); });
    }

    // ── Push notification ────────────────────────────────────────────────────────
    function pushNotif(title, body, senderEmail) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
            var notif = new Notification(title, {
                body: body,
                icon: 'https://cdn-icons-png.flaticon.com/512/733/733585.png',
                tag: 'chat-' + (senderEmail || 'msg'),
                renotify: true
            });
            if (senderEmail) {
                notif.onclick = function () {
                    window.focus();
                    var contactEl = document.getElementById('c-' + senderEmail);
                    if (contactEl) openChat(contactEl);
                    else window.location.href = '/user/chat?open=' + encodeURIComponent(senderEmail);
                    notif.close();
                };
            }
        } catch (e) {}
    }

    // ── FCM ──────────────────────────────────────────────────────────────────────
    async function initFCM() {
        if (!window.FB_CONFIG || !window.FB_CONFIG.apiKey) return;
        try {
            const { initializeApp }                     = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
            const { getMessaging, getToken, onMessage } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js');
            const app       = initializeApp(window.FB_CONFIG);
            const messaging = getMessaging(app);
            const perm      = await Notification.requestPermission();
            if (perm !== 'granted') return;
            const reg   = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
            const token = await getToken(messaging, { vapidKey: window.VAPID_KEY, serviceWorkerRegistration: reg });
            if (token) {
                await fetch('/fcm/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
            }
            onMessage(messaging, function (payload) {
                var n = payload.notification || {};
                pushNotif(n.title || 'New message', n.body || '');
            });
        } catch (e) { console.warn('FCM init error:', e.message); }
    }

    // ── Keyboard helpers ──────────────────────────────────────────────────────────
    function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } }
    function autoH(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
    function scrollBottom() { var l = document.getElementById('msgList'); if (l) l.scrollTop = l.scrollHeight; }
    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function fmtTime(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) d = new Date(iso + 'Z');
        if (isNaN(d.getTime())) return '';
        return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    function showStatus(t) { document.getElementById('statusText').textContent = t; document.getElementById('statusBar').classList.add('show'); }
    function hideStatus() { document.getElementById('statusBar').classList.remove('show'); }
    function getCookie(name) {
        var found = document.cookie.split(';').map(function(c){return c.trim();}).find(function(c){return c.startsWith(name+'=');});
        return found ? found.split('=')[1] : '';
    }
    function filterContacts(q) {
        q = q.toLowerCase();
        document.querySelectorAll('.contact-item').forEach(function(el) {
            el.style.display = (el.dataset.search||'').includes(q) ? '' : 'none';
        });
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            if (document.querySelector('.img-lightbox')) return;
            if (activeCtxMenu) { closeCtxMenu(); return; }
            closeAttachMenu();
            closeChat();
        }
    });

    function closeCtxMenu() { if (activeCtxMenu) { activeCtxMenu.remove(); activeCtxMenu = null; } }

    // ── Presence ─────────────────────────────────────────────────────────────────
    var onlineSet = new Set();

    function loadInitialPresence() {
        fetch('/api/presence/online')
            .then(function(r) { return r.json(); })
            .then(function(emails) {
                emails.forEach(function(e) { onlineSet.add(e); });
                refreshAllPresenceDots();
                if (currentEmail) {
                    var headerSub = document.querySelector('.ch-sub');
                    if (headerSub) {
                        headerSub.innerHTML = onlineSet.has(currentEmail)
                            ? '<span class="online-dot"></span>Online'
                            : '<span class="offline-dot"></span>Offline';
                    }
                }
            });
    }

    function refreshAllPresenceDots() {
        document.querySelectorAll('.contact-item').forEach(function(el) {
            var dot = el.querySelector('.presence-dot');
            if (!dot) return;
            dot.style.background = onlineSet.has(el.dataset.email) ? '#059669' : '#94a3b8';
            dot.title = onlineSet.has(el.dataset.email) ? 'Online' : 'Offline';
        });
    }

    function applyPresence(email, status) {
        if (status === 'ONLINE') onlineSet.add(email); else onlineSet.delete(email);
        var dot = document.querySelector('#c-' + CSS.escape(email) + ' .presence-dot');
        if (dot) { dot.style.background = status === 'ONLINE' ? '#059669' : '#94a3b8'; dot.title = status === 'ONLINE' ? 'Online' : 'Offline'; }
        if (email === currentEmail) {
            var headerSub = document.querySelector('.ch-sub');
            if (headerSub) {
                headerSub.innerHTML = status === 'ONLINE'
                    ? '<span class="online-dot"></span>Online'
                    : '<span class="offline-dot"></span>Offline';
            }
        }
    }

    // ── IMAGE upload ─────────────────────────────────────────────────────────────
    var pendingFiles = [];

    function handleImagePick(input) {
        var picked  = Array.from(input.files);
        input.value = '';
        if (!picked.length) return;

        var allowed = ['image/jpeg','image/jpg','image/png','image/gif','image/webp'];
        var badType = picked.filter(function(f) { return !allowed.includes(f.type); });
        var tooBig  = picked.filter(function(f) { return f.size > 1024*1024; });
        if (badType.length) alert(badType.length + ' file(s) skipped — unsupported type.');
        if (tooBig.length)  alert(tooBig.length  + ' file(s) skipped — exceeds 1 MB.');
        picked = picked.filter(function(f) { return allowed.includes(f.type) && f.size <= 1024*1024; });

        var space = 5 - pendingFiles.length;
        if (space <= 0) { alert('Maximum 5 images per message.'); return; }
        if (picked.length > space) { alert('Only ' + space + ' more image(s) can be added.'); picked = picked.slice(0, space); }

        pendingFiles = pendingFiles.concat(picked);
        buildPreviewBar();
    }

    // ── DOCUMENT upload ───────────────────────────────────────────────────────────
    var pendingDocs = []; // Array<File>

    function handleDocPick(input) {
        var picked  = Array.from(input.files);
        input.value = '';
        if (!picked.length) return;

        var tooBig = picked.filter(function(f) { return f.size > 20*1024*1024; });
        if (tooBig.length) alert(tooBig.length + ' file(s) skipped — exceeds 20 MB.');
        picked = picked.filter(function(f) { return f.size <= 20*1024*1024; });

        var space = 5 - pendingDocs.length;
        if (space <= 0) { alert('Maximum 5 documents per message.'); return; }
        if (picked.length > space) { alert('Only ' + space + ' more document(s) can be added.'); picked = picked.slice(0, space); }

        pendingDocs = pendingDocs.concat(picked);
        buildPreviewBar();
    }

    // ── Combined preview bar (images + docs) ─────────────────────────────────────
    function buildPreviewBar() {
        removeImgPreviewBar();
        if (!pendingFiles.length && !pendingDocs.length) return;

        var bar = document.createElement('div');
        bar.className = 'img-preview-bar';
        bar.id = 'imgPreviewBar';

        var thumbs = document.createElement('div');
        thumbs.className = 'preview-thumbs';

        // Image thumbs
        pendingFiles.forEach(function(file, idx) {
            var wrap = document.createElement('div');
            wrap.className = 'preview-thumb';

            var img = document.createElement('img');
            img.alt = file.name;

            var removeBtn       = document.createElement('button');
            removeBtn.className   = 'remove-thumb';
            removeBtn.textContent = '×';
            removeBtn.title       = 'Remove';
            removeBtn.onclick     = function() { removePreviewFile(idx); };

            var reader = new FileReader();
            reader.onload = function(e) { img.src = e.target.result; };
            reader.readAsDataURL(file);

            wrap.appendChild(img);
            wrap.appendChild(removeBtn);
            thumbs.appendChild(wrap);
        });

        // Doc thumbs
        pendingDocs.forEach(function(file, idx) {
            var wrap = document.createElement('div');
            wrap.className = 'preview-doc-thumb';

            var icon       = document.createElement('span');
            icon.style.cssText = 'display:flex;flex-direction:column;align-items:center;flex-shrink:0;';
            icon.innerHTML = docIconForFile(file);

            var nameEl       = document.createElement('span');
            nameEl.className = 'doc-name-sm';
            nameEl.textContent = file.name;
            nameEl.title = file.name;

            var removeBtn   = document.createElement('button');
            removeBtn.className   = 'remove-thumb';
            removeBtn.textContent = '×';
            removeBtn.title       = 'Remove';
            removeBtn.onclick     = function() { removePreviewDoc(idx); };

            wrap.appendChild(icon);
            wrap.appendChild(nameEl);
            wrap.appendChild(removeBtn);
            thumbs.appendChild(wrap);
        });

        var total = pendingFiles.length + pendingDocs.length;
        var actions = document.createElement('div');
        actions.className = 'preview-actions';
        actions.innerHTML =
            '<span class="img-upload-progress" id="uploadStatus">' + total + ' file' + (total > 1 ? 's' : '') + ' ready</span>'
            + '<button class="cancel-img" onclick="cancelAllPending()">✕ Cancel all</button>';

        bar.appendChild(thumbs);
        bar.appendChild(actions);

        var inputArea = document.querySelector('.input-area');
        if (inputArea) inputArea.parentNode.insertBefore(bar, inputArea);
    }

    function docIconForFile(file) {
        var mime = file.type || '';
        var ext  = file.name && file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
        var color, label;
        if (mime.includes('pdf') || ext === 'pdf')
        { color = 'var(--ocean)'; label = 'PDF'; }
        else if (mime.includes('word') || ext === 'doc' || ext === 'docx' || ext === 'odt')
        { color = 'var(--mid)'; label = 'DOC'; }
        else if (mime.includes('excel') || mime.includes('spreadsheet') || ext === 'xls' || ext === 'xlsx' || ext === 'csv' || ext === 'ods')
        { color = '#0891b2'; label = 'XLS'; }
        else if (mime.includes('powerpoint') || mime.includes('presentation') || ext === 'ppt' || ext === 'pptx')
        { color = 'var(--mid)'; label = 'PPT'; }
        else if (mime.includes('zip') || mime.includes('rar') || mime.includes('7z') || ext === 'zip' || ext === 'rar' || ext === '7z')
        { color = 'var(--muted)'; label = 'ZIP'; }
        else if (mime.includes('text') || mime.includes('json') || mime.includes('xml') || ext === 'txt' || ext === 'json' || ext === 'xml' || ext === 'rtf')
        { color = 'var(--mid)'; label = 'TXT'; }
        else
        { color = 'var(--muted)'; label = 'FILE'; }
        return '<i class="fa-solid fa-file" style="font-size:20px;color:' + color + '"></i>'
            + '<span style="font-size:7px;font-weight:700;color:' + color + ';line-height:1;margin-top:1px;letter-spacing:.03em">' + label + '</span>';
    }

    function removePreviewFile(idx) {
        pendingFiles.splice(idx, 1);
        (pendingFiles.length || pendingDocs.length) ? buildPreviewBar() : cancelAllPending();
    }

    function removePreviewDoc(idx) {
        pendingDocs.splice(idx, 1);
        (pendingFiles.length || pendingDocs.length) ? buildPreviewBar() : cancelAllPending();
    }

    function removeImgPreviewBar() { var b = document.getElementById('imgPreviewBar'); if (b) b.remove(); }

    function cancelAllPending() {
        pendingFiles = [];
        pendingDocs  = [];
        removeImgPreviewBar();
    }

    // ── Upload images + docs, then send via WebSocket ────────────────────────────
    async function uploadAndSend() {
        var status    = document.getElementById('uploadStatus');
        if (status) status.textContent = 'Uploading…';

        var textInput = document.getElementById('msgInput');
        var text      = textInput ? (textInput.value || '').trim() : '';

        try {
            var imageUrls    = [];
            var documentMetas = [];

            // Upload images
            if (pendingFiles.length > 0) {
                var imgForm = new FormData();
                pendingFiles.forEach(function(f) { imgForm.append('files', f); });
                var imgRes  = await fetch('/api/chat/upload-image', { method: 'POST', body: imgForm });
                if (!imgRes.ok) {
                    var err = await imgRes.json().catch(function() { return {}; });
                    throw new Error(err.error || 'Image upload failed');
                }
                var imgData = await imgRes.json();
                imageUrls   = imgData.imageUrls || [];
            }

            // Upload documents
            if (pendingDocs.length > 0) {
                var docForm = new FormData();
                pendingDocs.forEach(function(f) { docForm.append('files', f); });
                var docRes  = await fetch('/api/chat/upload-document', { method: 'POST', body: docForm });
                if (!docRes.ok) {
                    var err2 = await docRes.json().catch(function() { return {}; });
                    throw new Error(err2.error || 'Document upload failed');
                }
                var docData  = await docRes.json();
                documentMetas = docData.documentMetas || [];
            }

            stompClient.send('/app/chat.send', {}, JSON.stringify({
                toEmail:       currentEmail,
                content:       text,
                imageUrls:     imageUrls,
                documentMetas: documentMetas
            }));

            cancelAllPending();
            if (textInput) { textInput.value = ''; textInput.style.height = 'auto'; textInput.focus(); }

        } catch (err) {
            if (status) status.textContent = '⚠ ' + err.message;
        }
    }

    // ── Lightbox ─────────────────────────────────────────────────────────────────
    function openFullImage(src) {
        var box = document.createElement('div');
        box.className = 'img-lightbox';

        var closeBtn     = document.createElement('button');
        closeBtn.className = 'lightbox-close';
        closeBtn.innerHTML = '&times;';

        var img    = document.createElement('img');
        img.src    = src;
        img.onclick = function(e) { e.stopPropagation(); };

        function closeLightbox() {
            if (document.body.contains(box)) document.body.removeChild(box);
            document.removeEventListener('keydown', keyHandler);
        }
        function keyHandler(e) { if (e.key === 'Escape') { e.stopImmediatePropagation(); closeLightbox(); } }

        document.addEventListener('keydown', keyHandler);
        closeBtn.onclick = function(e) { e.stopPropagation(); closeLightbox(); };
        box.onclick = closeLightbox;
        box.appendChild(closeBtn);
        box.appendChild(img);
        document.body.appendChild(box);
    }

    // ── Message context menu ─────────────────────────────────────────────────────
    var activeCtxMenu = null;

    function toggleMsgMenu(event, btn) {
        event.stopPropagation();
        closeCtxMenu();

        var msgDiv = btn.closest('.msg');
        var msgId  = msgDiv.id ? msgDiv.id.replace('msg-', '') : null;
        if (!msgId) return;

        var isMine    = msgDiv.dataset.mine === '1';
        var imageUrls = JSON.parse(msgDiv.dataset.imageUrls || '[]');
        var docMetas  = JSON.parse(msgDiv.dataset.docMetas  || '[]');
        var content   = msgDiv.dataset.content;
        var items     = [];

        if (imageUrls.length > 0) {
            var dlLabel = imageUrls.length > 1 ? 'Download All (' + imageUrls.length + ')' : 'Download';
            items.push({ svg: svgDownload(), label: dlLabel, danger: false,
                action: function() { downloadImages(imageUrls); } });
        }

        if (docMetas.length > 0) {
            var docDlLabel = docMetas.length > 1 ? 'Download All Docs (' + docMetas.length + ')' : 'Download Doc';
            items.push({ svg: svgDownload(), label: docDlLabel, danger: false,
                action: function() { downloadDocs(docMetas); } });
        }

        if (imageUrls.length > 0 && content && content.trim()) {
            items.push({ svg: svgCopy(), label: 'Copy Text', danger: false, action: function() { copyText(content); } });
        } else if (content && content.trim()) {
            items.push({ svg: svgCopy(), label: 'Copy', danger: false, action: function() { copyText(content); } });
        }

        if (isMine) {
            items.push({ svg: svgDelete(), label: 'Delete', danger: true, action: function() { deleteMsg(msgId); } });
        }

        if (!items.length) return;

        var menu = document.createElement('div');
        menu.className = 'msg-ctx-menu';

        items.forEach(function(item) {
            var row = document.createElement('div');
            row.className = 'msg-ctx-item' + (item.danger ? ' danger' : '');
            row.appendChild(item.svg);
            var lbl = document.createElement('span'); lbl.textContent = item.label;
            row.appendChild(lbl);
            row.onclick = function() { item.action(); closeCtxMenu(); };
            menu.appendChild(row);
        });

        document.body.appendChild(menu);
        activeCtxMenu = menu;

        var btnRect  = btn.getBoundingClientRect();
        var menuRect = menu.getBoundingClientRect();
        var top  = btnRect.bottom + 4;
        if (top + menuRect.height > window.innerHeight - 8) top = btnRect.top - menuRect.height - 4;
        var left = btnRect.right - menuRect.width;
        if (left < 8) left = 8;
        if (left + menuRect.width > window.innerWidth - 8) left = window.innerWidth - menuRect.width - 8;
        menu.style.top  = top  + 'px';
        menu.style.left = left + 'px';

        setTimeout(function() { document.addEventListener('click', closeCtxMenu, { once: true }); }, 10);
    }

    function downloadImages(urls) {
        urls.forEach(function(url, i) {
            setTimeout(function() {
                var a = document.createElement('a');
                a.href = url;
                a.download = url.substring(url.lastIndexOf('/') + 1);
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }, i * 350);
        });
    }

    function downloadDocs(docs) {
        docs.forEach(function(doc, i) {
            setTimeout(function() {
                var a = document.createElement('a');
                a.href = doc.url;
                a.download = doc.name;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            }, i * 350);
        });
    }

    function copyText(content) {
        if (navigator.clipboard) navigator.clipboard.writeText(content).catch(function() { fallbackCopy(content); });
        else fallbackCopy(content);
    }
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
    }

    async function deleteMsg(msgId) {
        if (!confirm('Delete this message for everyone?')) return;
        try {
            var res = await fetch('/api/chat/message/' + encodeURIComponent(msgId), { method: 'DELETE' });
            if (res.ok) {
                markAsDeleted(document.getElementById('msg-' + msgId));
            } else {
                var body = await res.json().catch(function() { return {}; });
                alert(body.error || 'Could not delete message.');
            }
        } catch(e) { console.error('Delete failed:', e); }
    }

    function markAsDeleted(el) {
        if (!el) return;
        el.dataset.imageUrls = '[]';
        el.dataset.docMetas  = '[]';
        el.dataset.content   = '';
        var bubbleWrap = el.querySelector('.bubble-wrap');
        if (bubbleWrap) {
            bubbleWrap.innerHTML =
                '<div class="bubble bubble-deleted">'
                + '<i class="fa-solid fa-ban" style="font-size:11px;opacity:.7;flex-shrink:0"></i>'
                + 'This message was deleted'
                + '</div>';
        }
        el.style.opacity = '1';
        el.style.transition = '';
    }

    // ── SVG icon helpers ──────────────────────────────────────────────────────────
    function makeSvg(pathHtml) {
        var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
        s.setAttribute('width','15'); s.setAttribute('height','15');
        s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
        s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width','2');
        s.setAttribute('stroke-linecap','round'); s.setAttribute('stroke-linejoin','round');
        s.innerHTML = pathHtml;
        return s;
    }
    function svgDownload() {
        return makeSvg('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>');
    }
    function svgCopy() {
        return makeSvg('<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>');
    }
    function svgDelete() {
        return makeSvg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>');
    }

    // ── Boot ─────────────────────────────────────────────────────────────────────
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    connect();
    initFCM();
</script>
